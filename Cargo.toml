[package]
name = "fillgate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Execution engine with a gate in front of every order: state machine, idempotent client IDs, position and loss limits, kill switch, simulated exchange with chaos, and paper-venue adapters."
repository = "https://github.com/Intermountainh8ter/fillgate"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
rand_pcg = "0.9"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "fillgate"
path = "src/main.rs"
